packages:
  fj:
    externals:
    - spec: fj@4.12.2
      prefix: /opt/FJSVxtclanga/tcsds-1.2.43
      extra_attributes:
        compilers:
          c: /opt/FJSVxtclanga/tcsds-1.2.43/bin/fcc
          cxx: /opt/FJSVxtclanga/tcsds-1.2.43/bin/FCC
          fortran: /opt/FJSVxtclanga/tcsds-1.2.43/bin/frt
        environment:
          set:
            fcc_ENV: -Nclang
            FCC_ENV: -Nclang
          prepend_path:
            PATH: /opt/FJSVxtclanga/tcsds-1.2.43/bin
            LD_LIBRARY_PATH: /opt/FJSVxtclanga/tcsds-1.2.43/lib64
        extra_rpaths: []
  gcc:
    externals:
    - spec: gcc@8.5.0 languages:='c,c++,fortran'
      prefix: /usr
      extra_attributes:
        compilers:
          c: /usr/bin/gcc
          cxx: /usr/bin/g++
          fortran: /usr/bin/gfortran
# -------------------------------------------------------------------------
  all:
    providers:
      blas: [fujitsu-ssl2, openblas]
      c: [fj, gcc, llvm]
      cxx: [fj, gcc, llvm]
      fftw-api: [fujitsu-fftw, fftw, rist-fftw]
      fortran: [fj, gcc, llvm]
      lapack: [fujitsu-ssl2, openblas]
      mpi: [fujitsu-mpi, openmpi, mpich]
      scalapack: [fujitsu-ssl2, netlib-scalapack]
    require:
    - '+omp'
    - '+openmp'
    - '+mpi'
# -------------------------------------------------------------------------
  fujitsu-ssl2:
    buildable: false
    externals:
    - spec: fujitsu-ssl2@head arch=linux-rhel8-a64fx %fj@4.12.2
      prefix: /opt/FJSVxtclanga/tcsds-ssl2-latest
  fujitsu-mpi:
    buildable: false
    externals:
    - spec: fujitsu-mpi@head   arch=linux-rhel8-a64fx %fj@4.12.2
      prefix: /opt/FJSVxtclanga/tcsds-mpi-1.2.43
# -------------------------------------------------------------------------
  openblas:
    require:
    - spec: '~dynamic_dispatch'
